name: Contrôle SSOT & Sécurité des Règles Firebase

# ==============================================================================
# Workflow d'Intégration Continue (CI) - Garde-Fou des Règles Firestore & Storage
# Empêche toute réintroduction accidentelle de règles dans les satellites
# et valide l'exécution des tests de sécurité sous émulateurs Firebase.
# ==============================================================================

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'scripts/**'
      - '__tests__/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rules-guard.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'scripts/**'
      - '__tests__/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rules-guard.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-rules:
    name: Audit SSOT & Tests Émulateur
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: 'true'

    steps:
      # 1. Extraction d'Orquestrador (Dépôt SSOT Maître)
      - name: 📥 Extraire le dépôt maître (Orquestrador)
        uses: actions/checkout@v4
        with:
          path: o-girador-orquestrador

      # 2. Extraction des applications satellites pour audit de leurs configurations
      - name: 📥 Extraire Séquenciad'Or
        uses: actions/checkout@v4
        with:
          repository: julianbiblocq/o-girador
          path: o-girador-sequenciador
        continue-on-error: true

      - name: 📥 Extraire Organizad'Or
        uses: actions/checkout@v4
        with:
          repository: JulianBiblocq/O-Girador-manager
          path: o-girador-organizador
        continue-on-error: true

      - name: 📥 Extraire Dançad'Or
        uses: actions/checkout@v4
        with:
          repository: JulianBiblocq/O-GIRADOR-DANCA
          path: o-girador-dancador
        continue-on-error: true

      # 3. Configuration de l'environnement Java (Pré-requis Émulateurs Firebase)
      - name: ☕ Configurer Java 21 LTS (Headless Émulateurs)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. Configuration de Node.js 20 LTS
      - name: 🟢 Configurer Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: o-girador-orquestrador/package-lock.json

      # 5. Installation des dépendances du projet maître
      - name: 📦 Installer les dépendances (npm ci)
        working-directory: o-girador-orquestrador
        run: npm ci

      # 6. Audit anti-régression des satellites (Vérifie l'absence de 'firestore'/'storage' et de règles fantômes)
      - name: 🛡️ Audit du Garde-Fou SSOT (test:ssot)
        working-directory: o-girador-orquestrador
        run: npm run test:ssot

      # 7. Exécution de la suite de tests unitaires sous émulateurs Firebase
      - name: 🧪 Démarrage des Émulateurs & Tests de Sécurité (test:rules)
        working-directory: o-girador-orquestrador
        run: npm run test:rules
