name: Contrôle SSOT & Sécurité des Règles Firebase

# ==============================================================================
# Workflow d'Intégration Continue (CI) - Garde-Fou des Règles Firestore & Storage
# Empêche toute réintroduction accidentelle de règles dans les satellites
# et valide l'exécution des tests de sécurité sous émulateurs Firebase.
# ==============================================================================

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'scripts/**'
      - '__tests__/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rules-guard.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - 'scripts/**'
      - '__tests__/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rules-guard.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-rules:
    name: Audit SSOT & Tests Émulateur
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: 'true'
      DANCADOR_TOKEN: ${{ secrets['DANCADOR_TOKEN'] }}
      VOCAL_LAB_TOKEN: ${{ secrets['VOCAL_LAB_TOKEN'] }}

    steps:
      # 1. Extraction d'Orquestrador (Dépôt SSOT Maître)
      - name: 📥 Extraire le dépôt maître (Orquestrador)
        uses: actions/checkout@v4
        with:
          path: o-girador-orquestrador

      # 2. Extraction stricte des applications satellites (zéro continue-on-error)
      - name: 📥 Extraire Sequenciador
        uses: actions/checkout@v4
        with:
          repository: julianbiblocq/o-girador
          path: o-girador-sequenciador

      - name: 📥 Extraire Organizador & Mostrador
        uses: actions/checkout@v4
        with:
          repository: JulianBiblocq/O-Girador-manager
          path: o-girador-organizador

      - name: 📥 Extraire Cantador
        uses: actions/checkout@v4
        with:
          repository: JulianBiblocq/o-girador-vocal-lab
          token: ${{ env.VOCAL_LAB_TOKEN || env.DANCADOR_TOKEN || github.token }}
          path: o-girador-vocal-lab

      # Dançador étant un dépôt privé, son extraction utilise DANCADOR_TOKEN lorsqu'il est configuré
      - name: 📥 Extraire Dançador (si token présent)
        if: env.DANCADOR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: JulianBiblocq/O-GIRADOR-DANCA
          token: ${{ env.DANCADOR_TOKEN }}
          path: o-girador-dancador

      # 3. Configuration de l'environnement Java (Pré-requis Émulateurs Firebase)
      - name: ☕ Configurer Java 21 LTS (Headless Émulateurs)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. Configuration de Node.js 22 LTS
      - name: 🟢 Configurer Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: o-girador-orquestrador/package-lock.json

      # 5. Installation des dépendances du projet maître
      - name: 📦 Installer les dépendances (npm ci)
        working-directory: o-girador-orquestrador
        run: npm ci

      # 6. Audit anti-régression des satellites & gouvernance locale
      - name: 🛡️ Audit du Garde-Fou SSOT (test:ssot & check:governance)
        working-directory: o-girador-orquestrador
        run: |
          npm run test:ssot
          npm run check:governance

      # 7. Exécution de la suite de tests unitaires sous émulateurs Firebase
      - name: 🧪 Démarrage des Émulateurs & Tests de Sécurité (test:rules)
        working-directory: o-girador-orquestrador
        run: npm run test:rules
