<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>O Girador Écosystème — Navigation Fallback</title>
    <script>
      // Script SPA Fallback GitHub Pages : Redirige les sous-chemins vers l'index avec hash route (#admin, etc.)
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
